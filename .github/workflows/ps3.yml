name: PS3 build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned so the cached toolchain only rebuilds when we bump these on purpose.
  PS3TOOLCHAIN_REF: de85d7d5d11dc0a99d823ece3d440eea46c34d0f
  PSL1GHT_REF: f649a08fd536a9e27c08c7db2d93a2d7ee4c3bbe
  TOOLCHAIN_CACHE_KEY: ps3dev-v1-de85d7d5-f649a08f

jobs:
  toolchain:
    name: PS3 toolchain (cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Look for the cached toolchain
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          lookup-only: true

      - name: Install build requirements
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            autoconf automake bison flex gcc g++ libelf-dev make texinfo \
            libncurses-dev patch python3 python-is-python3 python3-dev \
            wget zlib1g-dev libtool-bin bzip2 libgmp-dev pkg-config libssl-dev

      - name: Fetch ps3toolchain and PSL1GHT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ps3dev/ps3toolchain "$RUNNER_TEMP/ps3toolchain"
          git -C "$RUNNER_TEMP/ps3toolchain" checkout "$PS3TOOLCHAIN_REF"
          git clone https://github.com/ps3dev/PSL1GHT "$RUNNER_TEMP/psl1ght"
          git -C "$RUNNER_TEMP/psl1ght" checkout "$PSL1GHT_REF"

      - name: Set up environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "BUILD_PS3TOOLCHAIN_ONLY=1" >> "$GITHUB_ENV"
          echo "NO_SAVANNAH=1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/spu/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ps3dev"

      - name: Download toolchain sources
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: mkdir -p build && cd build && ../download.sh

      - name: Binutils (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 001
      - name: GCC + newlib (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 002
      - name: Symlinks (PPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 004
      - name: Binutils (SPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 005
      - name: GCC + newlib (SPU)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/ps3toolchain
        run: ./toolchain.sh 006

      - name: PSL1GHT
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/psl1ght
        run: make install-ctrl && make && make install

      - name: Save toolchain to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}

  shaders:
    name: RSX shader assembler and generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch PSL1GHT (for the reference cgcomp)
        run: |
          git clone -q https://github.com/ps3dev/PSL1GHT "$RUNNER_TEMP/psl1ght"
          git -C "$RUNNER_TEMP/psl1ght" checkout -q "$PSL1GHT_REF"
      - name: Same bytes as cgcomp -a; generated programs assemble and match D3D9 maths
        run: tools/rsx-asm-test/run.sh "$RUNNER_TEMP/psl1ght"

  loader-tests-x86:
    name: Endian helpers + Bink decoders (x86 ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: x86-64, ASan + UBSan
        run: tools/endian-test/run.sh asan
      - name: Install 32-bit libraries
        run: sudo apt-get update && sudo apt-get -y install g++-multilib
      - name: x86 -m32 (ILP32, like the PC build), ASan + UBSan
        continue-on-error: true  # new; make it blocking once it has passed a few runs
        run: tools/endian-test/run.sh asan32

  loader-tests-be:
    name: Endian helpers + Bink decoders (big-endian powerpc64, qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the powerpc64 cross compiler and qemu-user
        # A separate job from the -m32 one: g++-multilib and the cross compilers conflict.
        run: sudo apt-get update && sudo apt-get -y install g++-powerpc64-linux-gnu qemu-user file
      - name: Big-endian, as on the PS3
        run: tools/endian-test/run.sh ppc64

  game:
    name: THUG PS3 (${{ matrix.variant }})
    needs: toolchain
    runs-on: ubuntu-24.04
    # The asserts build (ASSERTS=1) is new: it doesn't fail the workflow until it has built cleanly.
    continue-on-error: ${{ matrix.variant == 'asserts' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [headless, release, asserts]
    steps:
      - uses: actions/checkout@v5

      - name: Restore toolchain
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Set up environment
        run: |
          sudo apt-get update && sudo apt-get -y install libelf-dev python3
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ps3dev/ppu/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -o pipefail
          ppu-gcc --version | head -1
          HEADLESS=$([ "${{ matrix.variant }}" = headless ] && echo 1 || echo 0)
          # asserts: the release (video) build with the game's asserts logging to thug-ps3.log
          ASSERTS=$([ "${{ matrix.variant }}" = asserts ] && echo 1 || echo 0)
          # release: also the warnings the warning gate checks (they don't change the code)
          WARNINGS=$([ "${{ matrix.variant }}" = release ] && echo 1 || echo 0)
          make -f Makefile.ps3 HEADLESS=$HEADLESS ASSERTS=$ASSERTS WARNINGS=$WARNINGS -k -j"$(nproc)" 2>&1 | tee build.log

      - name: Report ELF size
        if: always()
        run: |
          elf=$(ls build-ps3/*/thug-ps3.elf 2>/dev/null | head -1)
          [ -n "$elf" ] || exit 0
          ppu-size -A "$elf" | awk 'NR>2 && $2>65536 {printf "%s=%dKB ", $1, $2/1024}' > sizes.txt
          echo "::notice title=ELF sections over 64 KB::$(cat sizes.txt)"
          echo "::notice title=Largest symbols::$(ppu-nm -S --size-sort -C "$elf" | tail -12 | awk '{printf "%s %dKB | ", $4, strtonum("0x"$2)/1024}')"

      - name: SELF for ps3load / PS3LoadX
        if: always()
        run: |
          self=$(ls build-ps3/*/thug-ps3.self 2>/dev/null | head -1)
          [ -n "$self" ] || exit 0
          suffix=$([ "${{ matrix.variant }}" = release ] && echo || echo "-${{ matrix.variant }}")
          cp "$self" "thug-ps3$suffix.self"

      - name: Symbol map (addresses in the log -> names)
        if: always()
        run: |
          elf=$(ls build-ps3/*/thug-ps3.elf 2>/dev/null | head -1)
          [ -n "$elf" ] || exit 0
          # Function descriptors (.opd, what function pointers hold) and code, sorted by address.
          ppu-nm -C --defined-only "$elf" | sort > thug-ps3.map
          # Plus each function's code address, so a [crash] pc/lr/stack line can be named.
          python3 tools/opd-map.py "$elf" thug-ps3.map || echo "opd-map failed: the map has descriptors only"

      - name: Look up log addresses (tools/lookup-addresses.txt)
        if: always() && matrix.variant == 'headless'
        run: |
          [ -f thug-ps3.map ] && [ -f tools/lookup-addresses.txt ] || exit 0
          python3 tools/lookup-addresses.py thug-ps3.map tools/lookup-addresses.txt

      - name: Report errors
        if: always()
        run: python3 tools/ci-annotate.py build.log "$GITHUB_WORKSPACE"

      # Fails on NEW pointer/int-truncating casts, uninitialised uses and missing returns
      # (the known ones are in tools/warning-baseline.txt). While that file is a bootstrap
      # placeholder it only reports, and the artifact carries warning-baseline.txt.new to commit.
      - name: Warning gate
        if: always() && matrix.variant == 'release'
        run: |
          [ -f build.log ] || exit 0
          python3 tools/warning-gate.py check tools/warning-baseline.txt build.log
          [ ! -f tools/warning-baseline.txt.new ] || cp tools/warning-baseline.txt.new warning-baseline.txt.new

      - name: Upload PKG and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thug-ps3-${{ matrix.variant }}
          retention-days: 7  # the account's Actions storage is small (0.5 GB)
          path: |
            thug-ps3*.pkg
            thug-ps3*.self
            thug-ps3.map
            build.log
            warning-baseline.txt.new
          if-no-files-found: warn
